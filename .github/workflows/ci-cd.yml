
name: Complete DevOps CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven Build and Test
        run: mvn -B clean verify

      - name: Verify SonarQube Authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN secret is missing"
            exit 1
          fi

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL secret is missing"
            exit 1
          fi

          RESPONSE=$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/authentication/validate")

          if [ "$RESPONSE" = '{"valid":true}' ]; then
            echo "SonarQube authentication successful"
          else
            echo "SonarQube authentication failed"
            exit 1
          fi

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar \
            -Dsonar.projectKey=devops-app \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN"

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS Identity
        if: github.event_name == 'push'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: devops-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Update EKS Kubeconfig
        if: github.event_name == 'push'
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name devops-eks-cluster

      - name: Deploy to EKS
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: devops-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/devops-app \
            devops-container="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Verify Deployment
        if: github.event_name == 'push'
        run: |
          kubectl rollout status deployment/devops-app --timeout=180s
          kubectl get pods -o wide

