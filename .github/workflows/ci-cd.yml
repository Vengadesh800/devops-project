
name: Complete DevOps CI/CD Pipeline

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven Build and Test
        run: mvn -B clean verify

      - name: Verify SonarQube Authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN is missing"
            exit 1
          fi

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL is missing"
            exit 1
          fi

          echo "Checking SonarQube authentication..."

          RESPONSE=$(curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/authentication/validate")

          if echo "$RESPONSE" | grep -q '"valid":true'; then
            echo "SUCCESS: SonarQube authentication verified"
          else
            echo "ERROR: SonarQube authentication failed"
            exit 1
          fi

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar \
            -Dsonar.projectKey=devops-app \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true 

      - name: Verify GitHub OIDC Claims
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          request = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " + token}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref", "event_name"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Verify AWS Role Configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_ARN secret is missing"
            exit 1
          fi

          if [ "$AWS_ROLE_ARN" != "arn:aws:iam::429601541112:role/GitHubActionsDevOpsRole" ]; then
            echo "ERROR: AWS_ROLE_ARN does not match the expected IAM role"
            exit 1
          fi

            echo "AWS role ARN matches the expected role"

      - name: Test GitHub OIDC Token
        shell: bash
        run: |
          echo "Checking OIDC environment..."

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || \
             [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "ERROR: Missing OIDC environment variables"
            exit 1
          fi

          echo "OIDC environment variables are present"

          python3 - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import json

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url += separator + urllib.parse.urlencode(
              {"audience": "sts.amazonaws.com"}
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " +
                  os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
                  if result.get("value"):
                      print("SUCCESS: GitHub OIDC token retrieved")
                  else:
                      print("ERROR: Response did not contain an ID token")
                      raise SystemExit(1)
          except Exception as error:
              print("OIDC request failed:", type(error).__name__)
              print("Error details:", str(error))
              raise SystemExit(1)
          PY

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GitHubActionsDevOps
          retry-max-attempts: 3

      - name: Verify AWS Identity
        if: github.event_name == 'push'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: devops-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Registry: $REGISTRY"
          echo "Repository: $REPOSITORY"
          echo "Image Tag: $IMAGE_TAG"

          docker build --provenance=false --sbom=false \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .

          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Update EKS Kubeconfig
        if: github.event_name == 'push'
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name devops-eks-cluster

      - name: Deploy to EKS
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: devops-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/devops-app \
            devops-container="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Verify Deployment
        if: github.event_name == 'push'
        run: |
          kubectl rollout status deployment/devops-app --timeout=180s
          kubectl get pods -o wide

